<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img"><title>Propagating bay split into nodes and reaches</title><style>
 text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2C2C2A}
 .th{font-size:14px;font-weight:600}.ts{font-size:12px}
 .c-blue rect,.c-blue circle{fill:#E6F1FB;stroke:#185FA5}.c-blue text{fill:#0C447C}
 .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}.c-teal text{fill:#085041}
 .c-purple rect,.c-purple circle{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
 .c-gray rect,.c-gray circle{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
 .arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="270" fill="#FFFFFF"/><g class="c-purple"><rect x="60" y="130" width="580" height="60" rx="8" stroke-width="0.8"/></g><g class="c-teal"><rect x="50" y="30" width="100" height="48" rx="8" stroke-width="0.8"/><text class="th" x="100.0" y="45.0" text-anchor="middle" dominant-baseline="central">Channel A</text><text class="ts" x="100.0" y="64.0" text-anchor="middle" dominant-baseline="central">discharge Q_A</text></g><g class="c-teal"><rect x="330" y="30" width="100" height="48" rx="8" stroke-width="0.8"/><text class="th" x="380.0" y="45.0" text-anchor="middle" dominant-baseline="central">Channel B</text><text class="ts" x="380.0" y="64.0" text-anchor="middle" dominant-baseline="central">discharge Q_B</text></g><line x1="100" y1="78" x2="100" y2="150" class="arr" marker-end="url(#arrow)"/><line x1="380" y1="78" x2="380" y2="150" class="arr" marker-end="url(#arrow)"/><line x1="100" y1="160" x2="600" y2="160" class="arr"/><g class="c-gray"><circle cx="100" cy="160" r="8" stroke-width="0.8"/></g><g class="c-gray"><circle cx="380" cy="160" r="8" stroke-width="0.8"/></g><g class="c-gray"><circle cx="600" cy="160" r="8" stroke-width="0.8"/></g><text class="ts" x="240" y="146" text-anchor="middle" dominant-baseline="central">reach 1, length ℓ₁</text><text class="ts" x="490" y="146" text-anchor="middle" dominant-baseline="central">reach 2, length ℓ₂</text><text class="th" x="100" y="214" text-anchor="middle" dominant-baseline="central">node 1: η₁</text><text class="ts" x="100" y="234" text-anchor="middle" dominant-baseline="central">x = 0, closed</text><text class="th" x="380" y="214" text-anchor="middle" dominant-baseline="central">node 2: η₂</text><text class="ts" x="380" y="234" text-anchor="middle" dominant-baseline="central">x = x_B</text><text class="th" x="600" y="214" text-anchor="middle" dominant-baseline="central">node 3: η₃</text><text class="ts" x="600" y="234" text-anchor="middle" dominant-baseline="central">x = L_bay, closed</text></svg>
