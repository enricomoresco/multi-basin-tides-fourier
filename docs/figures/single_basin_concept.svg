<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>One basin with inlets at different positions</title><style>
 text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2C2C2A}
 .th{font-size:14px;font-weight:600}.ts{font-size:12px}
 .c-blue rect,.c-blue circle{fill:#E6F1FB;stroke:#185FA5}.c-blue text{fill:#0C447C}
 .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}.c-teal text{fill:#085041}
 .c-purple rect,.c-purple circle{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
 .c-gray rect,.c-gray circle{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
 .arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/><g class="c-blue"><rect x="40" y="30" width="600" height="44" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central">Sea: ζ(t) = a0 sin(νt)</text></g><line x1="125" y1="74" x2="125" y2="100" class="arr"/><g class="c-teal"><rect x="80" y="100" width="90" height="56" rx="8" stroke-width="0.8"/><text class="th" x="125.0" y="119.0" text-anchor="middle" dominant-baseline="central">Inlet 1</text><text class="ts" x="125.0" y="138.0" text-anchor="middle" dominant-baseline="central">L1, B1, D1</text></g><line x1="125" y1="156" x2="125" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="255" y1="74" x2="255" y2="100" class="arr"/><g class="c-teal"><rect x="210" y="100" width="90" height="56" rx="8" stroke-width="0.8"/><text class="th" x="255.0" y="119.0" text-anchor="middle" dominant-baseline="central">Inlet 2</text><text class="ts" x="255.0" y="138.0" text-anchor="middle" dominant-baseline="central">L2, B2, D2</text></g><line x1="255" y1="156" x2="255" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="405" y1="74" x2="405" y2="100" class="arr"/><g class="c-teal"><rect x="360" y="100" width="90" height="56" rx="8" stroke-width="0.8"/><text class="th" x="405.0" y="119.0" text-anchor="middle" dominant-baseline="central">Inlet 3</text><text class="ts" x="405.0" y="138.0" text-anchor="middle" dominant-baseline="central">L3, B3, D3</text></g><line x1="405" y1="156" x2="405" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="535" y1="74" x2="535" y2="100" class="arr"/><g class="c-teal"><rect x="490" y="100" width="90" height="56" rx="8" stroke-width="0.8"/><text class="th" x="535.0" y="119.0" text-anchor="middle" dominant-baseline="central">Inlet 4</text><text class="ts" x="535.0" y="138.0" text-anchor="middle" dominant-baseline="central">L4, B4, D4</text></g><line x1="535" y1="156" x2="535" y2="182" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="40" y="186" width="600" height="60" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="207.0" text-anchor="middle" dominant-baseline="central">Bay: S, L_bay, d_bay</text><text class="ts" x="340.0" y="226.0" text-anchor="middle" dominant-baseline="central">Reaches between nodes: damped long wave</text></g><text class="ts" x="40" y="270" text-anchor="start" dominant-baseline="central">x = 0</text><text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">Nodes at the inlet positions x</text><text class="ts" x="640" y="270" text-anchor="end" dominant-baseline="central">x = L_bay</text></svg>
