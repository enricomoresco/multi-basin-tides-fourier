<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img"><title>Algorithm flow of multi_basin_fourier</title><style>
 text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2C2C2A}
 .th{font-size:14px;font-weight:600}.ts{font-size:12px}
 .c-blue rect,.c-blue circle{fill:#E6F1FB;stroke:#185FA5}.c-blue text{fill:#0C447C}
 .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}.c-teal text{fill:#085041}
 .c-purple rect,.c-purple circle{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
 .c-gray rect,.c-gray circle{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
 .arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/><g class="c-gray"><rect x="180" y="30" width="320" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="49.0" text-anchor="middle" dominant-baseline="central">1. Read input</text><text class="ts" x="340.0" y="68.0" text-anchor="middle" dominant-baseline="central">const*.txt + const*_extra.txt</text></g><line x1="340" y1="86" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="180" y="116" width="320" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="135.0" text-anchor="middle" dominant-baseline="central">2. Build the network</text><text class="ts" x="340.0" y="154.0" text-anchor="middle" dominant-baseline="central">Basin nodes, channel connections</text></g><line x1="340" y1="172" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="180" y="202" width="320" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="221.0" text-anchor="middle" dominant-baseline="central">3. Initial guess</text><text class="ts" x="340.0" y="240.0" text-anchor="middle" dominant-baseline="central">Linear network on all nodes</text></g><line x1="340" y1="258" x2="340" y2="286" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="180" y="288" width="320" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="307.0" text-anchor="middle" dominant-baseline="central">4. Newton on the harmonics</text><text class="ts" x="340.0" y="326.0" text-anchor="middle" dominant-baseline="central">All channels + all basins</text></g><line x1="340" y1="344" x2="340" y2="372" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="180" y="374" width="320" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="393.0" text-anchor="middle" dominant-baseline="central">5. Update bay friction</text><text class="ts" x="340.0" y="412.0" text-anchor="middle" dominant-baseline="central">One r per propagating basin</text></g><line x1="340" y1="430" x2="340" y2="458" class="arr" marker-end="url(#arrow)"/><g class="c-gray"><rect x="180" y="460" width="320" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="479.0" text-anchor="middle" dominant-baseline="central">6. Output</text><text class="ts" x="340.0" y="498.0" text-anchor="middle" dominant-baseline="central">Tables per basin and channel, CSV, NPZ</text></g><path d="M500 402 L560 402 L560 316 L504 316" class="arr" marker-end="url(#arrow)"/><text class="ts" x="568" y="351" text-anchor="start" dominant-baseline="central">↻ until all r</text><text class="ts" x="568" y="369" text-anchor="start" dominant-baseline="central">converge</text></svg>
