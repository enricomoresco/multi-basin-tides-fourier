xt-anchor="middle" dominant-baseline="central">C2</text><text class="ts" x="425.0" y="132.0" text-anchor="middle" dominant-baseline="central">Bear</text></g><line x1="425.0" y1="144" x2="425.0" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="515.0" y1="74" x2="515.0" y2="100" class="arr"/><g class="c-teal"><rect x="480" y="100" width="70" height="44" rx="8" stroke-width="0.8"/><text class="th" x="515.0" y="113.0" text-anchor="middle" dominant-baseline="central">C3</text><text class="ts" x="515.0" y="132.0" text-anchor="middle" dominant-baseline="central">Coral N</text></g><line x1="515.0" y1="144" x2="515.0" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="605.0" y1="74" x2="605.0" y2="100" class="arr"/><g class="c-teal"><rect x="570" y="100" width="70" height="44" rx="8" stroke-width="0.8"/><text class="th" x="605.0" y="113.0" text-anchor="middle" dominant-baseline="central">C4</text><text class="ts" x="605.0" y="132.0" text-anchor="middle" dominant-baseline="central">Coral S</text></g><line x1="605.0" y1="144" x2="605.0" y2="182" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="40" y="186" width="200" height="64" rx="8" stroke-width="0.8"/><text class="th" x="140.0" y="209.0" text-anchor="middle" dominant-baseline="central">North basin</text><text class="ts" x="140.0" y="228.0" text-anchor="middle" dominant-baseline="central">Sin · lumped or propagating</text></g><g class="c-purple"><rect x="300" y="186" width="340" height="64" rx="8" stroke-width="0.8"/><text class="th" x="470.0" y="209.0" text-anchor="middle" dominant-baseline="central">South basin</text><text class="ts" x="470.0" y="228.0" text-anchor="middle" dominant-baseline="central">S · lumped or propagating</text></g><path d="M140 250 L140 302 L200 302" class="arr"/><g class="c-teal"><rect x="200" y="280" width="140" height="44" rx="8" stroke-width="0.8"/><text class="th" x="270.0" y="293.0" text-anchor="middle" dominant-baseline="central">C7 Dodge</text><text class="ts"